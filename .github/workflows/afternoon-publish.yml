name: Afternoon Draft & Publish

on:
  schedule:
    # 09:00 UK time (UTC cron — adjust for BST/GMT if it matters to you).
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Draft, self-check, and publish or hold
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Commit result
        run: |
          git config user.name "golfislife-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p needs-review
          touch needs-review/.gitkeep
          git add src/content/posts needs-review
